spring.application.name=PruebaTecnicaAccenture

# Base de datos
DB_HOST=localhost
DB_PORT=3306
DB_NAME=franchise_db
DB_USER=root
DB_PASSWORD=admin123

# R2DBC
spring.r2dbc.url=r2dbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?connectionTimeZone=-05:00
spring.r2dbc.username=${DB_USER}
spring.r2dbc.password=${DB_PASSWORD}


# Pool de conexiones
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.max-idle-time=30m

# Servidor
server.port=8080

# Logs
logging.level.com.franchise=DEBUG
logging.level.io.r2dbc=INFO