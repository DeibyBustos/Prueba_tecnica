version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: franchise_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: franchise_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - franchise_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: franchise_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: franchise_db
      DB_USER: root
      DB_PASSWORD: admin123
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - franchise_network

networks:
  franchise_network:
    driver: bridge

volumes:
  mysql_data: